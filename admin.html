<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ASI Admin Panel - Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
    <style>
        :root { --bg-color: #0f0f13; --box-bg: #1c1c24; --primary: #ff4500; --text-color: #ffffff; --border: #333; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .admin-container { max-width: 800px; margin: 0 auto; }
        .admin-title { text-align: center; color: var(--primary); margin-bottom: 30px; font-size: 28px; font-weight: bold;}
        .box { background-color: var(--box-bg); padding: 25px; border-radius: 12px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .box h3 { margin-top: 0; border-bottom: 2px solid var(--border); padding-bottom: 10px; color: var(--primary); }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); background: #121216; color: white; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #e03e00; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .ep-list { margin-top: 15px; max-height: 200px; overflow-y: auto; background: #121216; border-radius: 6px; padding: 10px; }
        .ep-item { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 8px 12px; margin-bottom: 8px; border-radius: 4px; }
        .ep-item button { width: auto; padding: 5px 10px; background: #d32f2f; font-size: 14px;}
        .preview-img { max-width: 150px; border-radius: 8px; margin: 10px auto; display: block; }
    </style>
</head>
<body>

<div class="admin-container">
    <h2 class="admin-title">🔥 ASI Admin Panel</h2>

    <!-- LOGIN BOX -->
    <div class="box" id="loginBox">
        <h3 style="text-align:center;">Admin Login</h3>
        <input type="email" id="adminEmail" placeholder="Admin Email">
        <input type="password" id="adminPass" placeholder="Password">
        <button id="loginBtn">Login</button>
        <p id="loginError" style="color: #ff4d4d; text-align: center; margin-top: 10px;"></p>
    </div>

    <!-- MAIN PANEL -->
    <div id="adminPanel" style="display:none">
        <div style="text-align: right; margin-bottom: 20px;">
            <button id="logoutBtn" style="width: auto; background: #444; padding: 8px 20px;">Logout</button>
        </div>

        <!-- SHORTENER SETTINGS -->
        <div class="box">
            <h3>🔗 Dynamic Shortener API</h3>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 10px;">AdrinoLinks/Site ka URL aur API Key yahan daalein.</p>
            <div class="grid-2">
                <input id="shortApiUrl" placeholder="Site URL (e.g. adrinolinks.in)">
                <input id="shortApiKey" placeholder="Your API Token/Key">
            </div>
            <button id="saveShortenerBtn" style="margin-bottom: 10px;">💾 Save & Test API</button>
            <div id="apiTestResult" style="padding: 10px; background: #222; border-radius: 5px; font-size: 14px; text-align: center; font-weight: bold;">Status: Not Tested</div>
        </div>

        <!-- ADD ANIME -->
        <div class="box">
            <h3>🎬 Add New Content</h3>
            <input id="newName" placeholder="Name (e.g., Solo Leveling)">
            <div class="grid-2">
                <input id="newSeason" placeholder="Season (e.g., 1)">
                <input id="newYear" type="number" placeholder="Year (e.g., 2024)">
            </div>
            <div class="grid-2">
                <input id="newGenre" placeholder="Genre (e.g., Action, Magic)">
                <select id="newStatus">
                    <option value="Ongoing">Ongoing</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
            <select id="newType">
                <option value="Anime Sub">Anime (Hindi Sub)</option>
                <option value="Anime Dub">Anime (Hindi Dub)</option>
                <option value="K-Drama">K-Drama (Hindi Sub/Dub)</option>
                <option value="Movie">Movie</option>
                <option value="Series">Web Series</option>
            </select>
            <textarea id="newDesc" placeholder="Description"></textarea>
            <button id="uploadImgBtn" type="button" style="background:#0088cc; margin-bottom:10px;">📸 Upload Poster</button>
            <img id="imgPreview" class="preview-img" style="display:none;">
            <button id="addAnimeBtn">Save Content</button>
        </div>

        <!-- MANAGE EPISODES -->
        <div class="box">
            <h3>📺 Manage Episodes</h3>
            <input type="text" id="epSearch" placeholder="🔍 Search Content...">
            <select id="animeSelect"><option value="">Select Content</option></select>
            <div class="grid-2">
                <input id="epNum" type="number" placeholder="Ep No.">
                <input id="epLink" placeholder="Paste ORIGINAL Link (Drive/Bot)">
            </div>
            <button id="addEpBtn">Add Episode</button>
            <div id="existingEpisodesBox" style="display:none; margin-top: 20px;">
                <h4 style="color: var(--primary);">Current Episodes</h4>
                <div id="episodesContainer" class="ep-list"></div>
            </div>
        </div>

        <!-- DELETE ANIME -->
        <div class="box">
            <h3>🗑️ Delete Content</h3>
            <select id="deleteSelect"><option value="">Select to Delete</option></select>
            <button id="deleteAnimeBtn" style="background: #d32f2f;">Delete Permanently</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDoc, getDocs, doc, updateDoc, deleteDoc, arrayUnion, arrayRemove, setDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    // ✅ Aapka Original Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyA8Z3CvFTL402UF_6zY9v2iWLP8e_kZo1Q",
        authDomain: "asi-anime.firebaseapp.com",
        projectId: "asi-anime",
        storageBucket: "asi-anime.firebasestorage.app",
        messagingSenderId: "1029720406470",
        appId: "1:1029720406470:web:8ad8ad2d2ea1c7a4725ac7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let uploadedImage = "";
    let selectedAnimeId = "";

    // 1️⃣ Auth State Tracker
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById("adminPanel").style.display = "block";
            document.getElementById("loginBox").style.display = "none";
            loadList(); 
            loadSettings();
        } else {
            document.getElementById("adminPanel").style.display = "none";
            document.getElementById("loginBox").style.display = "block";
        }
    });

    // 2️⃣ Login
    document.getElementById("loginBtn").onclick = async () => {
        try { 
            await signInWithEmailAndPassword(auth, document.getElementById("adminEmail").value, document.getElementById("adminPass").value); 
        } catch (e) { 
            document.getElementById("loginError").innerText = e.message; 
        }
    };
    
    // 3️⃣ Logout
    document.getElementById("logoutBtn").onclick = () => signOut(auth);

    // ===============================================
    // 🔥 SHORTENER SAVE & DIRECT API TESTER (FIXED)
    // ===============================================
    async function loadSettings() {
        const snap = await getDoc(doc(db, "settings", "general"));
        if(snap.exists()) {
            document.getElementById("shortApiUrl").value = snap.data().shortUrl || "";
            document.getElementById("shortApiKey").value = snap.data().shortKey || "";
        }
    }
    
    document.getElementById("saveShortenerBtn").onclick = async () => {
        let rawUrl = document.getElementById("shortApiUrl").value.trim();
        let rawKey = document.getElementById("shortApiKey").value.trim();
        let statusBox = document.getElementById("apiTestResult");

        if(!rawUrl || !rawKey) return alert("Please fill URL and Key!");

        // Remove dashboard garbage and make it pure API link
        let cleanUrl = rawUrl.replace(/\/member.*/i, "").replace(/\/+$/, "");
        if (!cleanUrl.startsWith("http")) cleanUrl = "https://" + cleanUrl;
        if (!cleanUrl.endsWith("api")) cleanUrl += "/api";

        document.getElementById("shortApiUrl").value = cleanUrl;
        statusBox.innerHTML = "⏳ Testing API Connection...";
        statusBox.style.color = "yellow";

        // Save into DB
        await setDoc(doc(db, "settings", "general"), { shortUrl: cleanUrl, shortKey: rawKey }, { merge: true });

        // API Hit Logic (Using direct CORS fetch support via allorigins proxy)
        const testTarget = "https://google.com";
        const apiUrl = `${cleanUrl}?api=${rawKey}&url=${encodeURIComponent(testTarget)}`;

        try {
            // Testing directly to fetch JSON
            let isSuccess = false;
            try {
                let res = await fetch(apiUrl);
                let data = await res.json();
                if(data.status === "success" && data.shortenedUrl) isSuccess = true;
            } catch(e) {
                // If direct fetch blocks due to CORS in browser, test via proxy
                let proxy = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`);
                let pData = await proxy.json();
                if(pData.status === "success" && pData.shortenedUrl) isSuccess = true;
            }

            if(isSuccess) {
                statusBox.innerHTML = "✅ SUCCESS! Link generated correctly.";
                statusBox.style.color = "lime";
            } else {
                statusBox.innerHTML = "❌ API Key Invalid! Please double check your token.";
                statusBox.style.color = "#ff4d4d";
            }
        } catch(err) {
            statusBox.innerHTML = "❌ Critical Error! URL is unreachable.";
            statusBox.style.color = "#ff4d4d";
        }
    };
    // ===============================================

    // 4️⃣ Search Fix
    document.getElementById("epSearch").oninput = function(e) {
        const term = e.target.value.toLowerCase();
        const options = document.getElementById("animeSelect").options;
        for (let i = 0; i < options.length; i++) {
            options[i].style.display = options[i].text.toLowerCase().includes(term) || options[i].value === "" ? "block" : "none";
        }
    };

    // 5️⃣ Load Dropdowns
    async function loadList() {
        const snap = await getDocs(query(collection(db, "anime"), orderBy("name")));
        const select = document.getElementById("animeSelect");
        const delSelect = document.getElementById("deleteSelect");
        select.innerHTML = delSelect.innerHTML = "<option value=''>Select Content</option>";
        snap.forEach(d => {
            let opt = `<option value="${d.id}">${d.data().name} (${d.data().type})</option>`;
            select.innerHTML += opt; delSelect.innerHTML += opt;
        });
    }

    // 6️⃣ Cloudinary Upload
    document.getElementById("uploadImgBtn").onclick = () => {
        cloudinary.createUploadWidget({ cloudName: "dmxqosmk0", uploadPreset: "asi_anime_upload" }, (err, res) => {
            if (!err && res.event === "success") {
                uploadedImage = res.info.secure_url;
                document.getElementById("imgPreview").src = uploadedImage;
                document.getElementById("imgPreview").style.display = "block";
            }
        }).open();
    };

    // 7️⃣ Save Content
    document.getElementById("addAnimeBtn").onclick = async () => {
        const name = document.getElementById("newName").value.trim();
        if(!name || !uploadedImage) return alert("Name and Image are mandatory!");
        document.getElementById("addAnimeBtn").disabled = true;

        try {
            await addDoc(collection(db, "anime"), {
                name: name, season: document.getElementById("newSeason").value, year: document.getElementById("newYear").value,
                genre: document.getElementById("newGenre").value || "General", type: document.getElementById("newType").value,
                status: document.getElementById("newStatus").value, description: document.getElementById("newDesc").value,
                image: uploadedImage, episodes:[], updatedAt: Date.now()
            });
            alert("Saved! ✅"); location.reload();
        } catch (err) { alert(err.message); document.getElementById("addAnimeBtn").disabled = false; }
    };

    // 8️⃣ Load Episodes
    document.getElementById("animeSelect").onchange = (e) => {
        selectedAnimeId = e.target.value;
        if(selectedAnimeId) fetchEpisodes(); else document.getElementById("existingEpisodesBox").style.display = "none";
    };

    async function fetchEpisodes() {
        const docSnap = await getDoc(doc(db, "anime", selectedAnimeId));
        if(docSnap.exists()){
            const eps = docSnap.data().episodes ||[];
            document.getElementById("existingEpisodesBox").style.display = "block";
            document.getElementById("episodesContainer").innerHTML = eps.sort((a,b)=>Number(a.ep)-Number(b.ep)).map(ep => `
                <div class="ep-item"><span>Ep ${ep.ep}</span><button onclick="window.delEp('${ep.ep}','${ep.link}')">Delete</button></div>
            `).join('');
        }
    }
    
    // 9️⃣ Delete Ep
    window.delEp = async (ep, link) => {
        if(confirm(`Delete Ep ${ep}?`)) { await updateDoc(doc(db, "anime", selectedAnimeId), { episodes: arrayRemove({ ep, link }) }); fetchEpisodes(); }
    };

    // 🔟 Save Ep
    document.getElementById("addEpBtn").onclick = async () => {
        const epNum = document.getElementById("epNum").value;
        const link = document.getElementById("epLink").value.trim();
        if(!selectedAnimeId || !epNum || !link) return alert("Fill data!");
        await updateDoc(doc(db, "anime", selectedAnimeId), { episodes: arrayUnion({ ep: epNum, link: link }), updatedAt: Date.now()});
        alert("Added! ✅"); document.getElementById("epLink").value = ""; document.getElementById("epNum").value = parseInt(epNum) + 1; fetchEpisodes();
    };

    // 1️⃣1️⃣ Delete Anime
    document.getElementById("deleteAnimeBtn").onclick = async () => {
        const id = document.getElementById("deleteSelect").value;
        if(id && confirm("Delete?")) { await deleteDoc(doc(db, "anime", id)); alert("Deleted!"); loadList(); }
    };
</script>
</body>
</html>
