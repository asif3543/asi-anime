<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ASI Admin Panel - Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --box-bg: #1e1e1e;
            --primary: #ff4500;
            --primary-hover: #e03e00;
            --text-color: #ffffff;
            --border: #333333;
            --success: #2e7d32;
            --danger: #d32f2f;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .admin-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .admin-title {
            text-align: center;
            color: var(--primary);
            margin-bottom: 30px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .box {
            background-color: var(--box-bg);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }
        .box h3 {
            margin-top: 0;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            color: var(--primary);
            font-size: 20px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            background: #2a2a2a;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #555; cursor: not-allowed; }
        
        .delete-btn { background-color: var(--danger); }
        .delete-btn:hover { background-color: #b71c1c; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        /* Shortener List Styling */
        .shortener-card {
            background: #2a2a2a;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary);
        }
        .shortener-info { font-size: 14px; }
        .shortener-info span { display: block; color: #aaa; font-size: 12px; }

        .ep-list {
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
            background: #2a2a2a;
            border-radius: 6px;
            padding: 10px;
        }
        .ep-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e1e;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        .preview-img { max-width: 150px; border-radius: 8px; margin: 10px auto; display: block; border: 2px solid var(--primary); }
    </style>
</head>
<body>

<div class="admin-container">
    <h2 class="admin-title">🔥 ASI Advanced Admin</h2>

    <!-- LOGIN BOX -->
    <div class="box" id="loginBox">
        <h3 style="text-align:center;">Admin Access</h3>
        <input type="email" id="adminEmail" placeholder="Email">
        <input type="password" id="adminPass" placeholder="Password">
        <button id="loginBtn">Secure Login</button>
        <p id="loginError" style="color: var(--danger); text-align: center; margin-top: 10px;"></p>
    </div>

    <div id="adminPanel" style="display:none">
        
        <div style="text-align: right; margin-bottom: 20px;">
            <button id="logoutBtn" style="width: auto; padding: 8px 20px; background: #444;">Logout</button>
        </div>

        <!-- MANAGE SHORTENERS -->
        <div class="box">
            <h3>🔗 Shortener Accounts Manager</h3>
            <div class="grid-2">
                <input id="shortName" placeholder="Site Name (e.g. GPLinks)">
                <input id="shortApi" placeholder="API Token/Key">
            </div>
            <input id="shortUrl" placeholder="API URL (e.g. https://gplinks.in/api)">
            <small style="color: gray; display: block; margin-bottom: 10px;">Note: API URL format should be like https://sitename.com/api</small>
            <button id="addShortenerBtn" style="background: var(--success);">Add Shortener Account</button>
            
            <div id="shortenerList" style="margin-top: 20px;">
                <!-- Saved Shorteners will appear here -->
            </div>
        </div>

        <!-- ADD ANIME -->
        <div class="box">
            <h3>🎬 Add New Anime</h3>
            <input id="newName" placeholder="Anime Name">
            <div class="grid-2">
                <input id="newSeason" placeholder="Season">
                <input id="newYear" type="number" placeholder="Year">
            </div>
            <textarea id="newDesc" placeholder="Description"></textarea>
            <button id="uploadImgBtn">📸 Upload Poster</button>
            <img id="imgPreview" class="preview-img" style="display:none;">
            <button id="addAnimeBtn" style="margin-top: 15px;">Save Anime</button>
        </div>

        <!-- MANAGE EPISODES -->
        <div class="box">
            <h3>📺 Manage Episodes</h3>
            <input type="text" id="epAnimeSearch" placeholder="🔍 Search Anime to add episode...">
            <select id="animeSelect">
                <option value="">Select Anime</option>
            </select>

            <div class="grid-2" style="margin-top: 10px;">
                <input id="epNum" type="number" placeholder="Ep No.">
                <input id="epLink" placeholder="Raw Video/Drive/Bot Link">
            </div>
            <button id="addEpBtn">Shorten & Add Episode</button>

            <div id="existingEpisodesBox" style="display:none; margin-top: 20px;">
                <h4 style="color: var(--primary);">Current Episodes</h4>
                <div id="episodesContainer" class="ep-list"></div>
            </div>
        </div>

        <!-- DELETE ANIME -->
        <div class="box">
            <h3>🗑️ Delete Anime</h3>
            <input type="text" id="deleteSearch" placeholder="🔍 Search Anime to delete...">
            <select id="deleteSelect">
                <option value="">Select Anime</option>
            </select>
            <button id="deleteAnimeBtn" class="delete-btn">Delete Permanently</button>
        </div>

    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import {
        getFirestore, collection, addDoc, getDoc, getDocs, doc, 
        updateDoc, deleteDoc, arrayUnion, arrayRemove, setDoc, query, orderBy
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
    import { 
        getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA8Z3CvFTL402UF_6zY9v2iWLP8e_kZo1Q",
        authDomain: "asi-anime.firebaseapp.com",
        projectId: "asi-anime",
        storageBucket: "asi-anime.firebasestorage.app",
        messagingSenderId: "1029720406470",
        appId: "1:1029720406470:web:8ad8ad2d2ea1c7a4725ac7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let uploadedImage = "";
    let selectedAnimeId = "";
    let savedShorteners = [];

    // --- AUTH LOGIC ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById("adminPanel").style.display = "block";
            document.getElementById("loginBox").style.display = "none";
            loadList();
            loadShorteners();
        } else {
            document.getElementById("adminPanel").style.display = "none";
            document.getElementById("loginBox").style.display = "block";
        }
    });

    document.getElementById("loginBtn").onclick = async () => {
        const email = document.getElementById("adminEmail").value;
        const pass = document.getElementById("adminPass").value;
        try {
            await signInWithEmailAndPassword(auth, email, pass);
        } catch (e) { alert("Login Failed: " + e.message); }
    };

    document.getElementById("logoutBtn").onclick = () => signOut(auth);

    // --- SHORTENER MANAGEMENT ---
    async function loadShorteners() {
        const snap = await getDocs(collection(db, "settings"));
        savedShorteners = [];
        const listDiv = document.getElementById("shortenerList");
        listDiv.innerHTML = "";

        snap.forEach(d => {
            if(d.id.startsWith("short_")) {
                const data = d.data();
                data.id = d.id;
                savedShorteners.push(data);
                
                let div = document.createElement("div");
                div.className = "shortener-card";
                div.innerHTML = `
                    <div class="shortener-info">
                        <strong>${data.name}</strong>
                        <span>${data.url}</span>
                    </div>
                    <button onclick="window.removeShortener('${data.id}')" style="width:auto; padding:5px 10px; background:red; font-size:12px;">Remove</button>
                `;
                listDiv.appendChild(div);
            }
        });
    }

    document.getElementById("addShortenerBtn").onclick = async () => {
        const name = document.getElementById("shortName").value.trim();
        const api = document.getElementById("shortApi").value.trim();
        let url = document.getElementById("shortUrl").value.trim();

        if(!name || !api || !url) return alert("All fields required");
        if(url.endsWith("/")) url = url.slice(0, -1);

        const id = "short_" + Date.now();
        await setDoc(doc(db, "settings", id), { name, api, url });
        alert("Shortener Added!");
        loadShorteners();
    };

    window.removeShortener = async (id) => {
        if(confirm("Remove this shortener?")) {
            await deleteDoc(doc(db, "settings", id));
            loadShorteners();
        }
    };

    // --- LINK SHORTENING LOGIC (AUTO FAILOVER) ---
    async function getShortenedLink(longUrl) {
        if (savedShorteners.length === 0) {
            alert("No shortener account found! Using direct link.");
            return longUrl;
        }

        for (let account of savedShorteners) {
            try {
                // Common API format for most shorteners (GPLinks, ShrinkMe, etc.)
                const fetchUrl = `${account.url}?api=${account.api}&url=${encodeURIComponent(longUrl)}`;
                const response = await fetch(fetchUrl);
                const data = await response.json();

                if (data.status === "success" || data.shortenedUrl) {
                    return data.shortenedUrl || data.link;
                }
            } catch (err) {
                console.log(`Shortener ${account.name} failed, trying next...`);
            }
        }
        throw new Error("All shortener accounts failed. Please check APIs.");
    }

    // --- SEARCH FUNCTIONALITY ---
    function setupSearch(inputId, selectId) {
        document.getElementById(inputId).oninput = function(e) {
            const term = e.target.value.toLowerCase();
            const options = document.getElementById(selectId).options;
            for (let i = 0; i < options.length; i++) {
                const text = options[i].text.toLowerCase();
                options[i].style.display = text.includes(term) || options[i].value === "" ? "block" : "none";
            }
        };
    }
    setupSearch("deleteSearch", "deleteSelect");
    setupSearch("epAnimeSearch", "animeSelect");

    // --- ANIME & EPISODES LOGIC ---
    async function loadList() {
        const snap = await getDocs(query(collection(db, "anime"), orderBy("name")));
        const select1 = document.getElementById("animeSelect");
        const select2 = document.getElementById("deleteSelect");
        select1.innerHTML = "<option value=''>Select Anime</option>";
        select2.innerHTML = "<option value=''>Select Anime</option>";

        snap.forEach(d => {
            const opt = `<option value="${d.id}">${d.data().name}</option>`;
            select1.innerHTML += opt;
            select2.innerHTML += opt;
        });
    }

    document.getElementById("animeSelect").onchange = async (e) => {
        selectedAnimeId = e.target.value;
        if(!selectedAnimeId) return document.getElementById("existingEpisodesBox").style.display = "none";
        fetchEpisodes();
    };

    async function fetchEpisodes() {
        const docSnap = await getDoc(doc(db, "anime", selectedAnimeId));
        if(docSnap.exists()){
            const eps = docSnap.data().episodes || [];
            const container = document.getElementById("episodesContainer");
            document.getElementById("existingEpisodesBox").style.display = "block";
            container.innerHTML = "";
            
            eps.sort((a,b) => a.ep - b.ep).forEach(epObj => {
                let div = document.createElement("div");
                div.className = "ep-item";
                div.innerHTML = `<span>Episode ${epObj.ep}</span> <button style="width:auto; padding:5px; background:red;" onclick="window.deleteEp('${epObj.ep}','${epObj.link}')">Delete</button>`;
                container.appendChild(div);
            });
        }
    }

    window.deleteEp = async (ep, link) => {
        if(confirm("Delete Episode " + ep + "?")) {
            await updateDoc(doc(db, "anime", selectedAnimeId), {
                episodes: arrayRemove({ ep, link })
            });
            fetchEpisodes();
        }
    };

    document.getElementById("addEpBtn").onclick = async () => {
        const ep = document.getElementById("epNum").value;
        const rawLink = document.getElementById("epLink").value.trim();
        const btn = document.getElementById("addEpBtn");

        if(!selectedAnimeId || !ep || !rawLink) return alert("Details missing");

        try {
            btn.disabled = true;
            btn.innerText = "Shortening Link...";
            const finalLink = await getShortenedLink(rawLink);

            btn.innerText = "Uploading...";
            await updateDoc(doc(db, "anime", selectedAnimeId), {
                episodes: arrayUnion({ ep, link: finalLink }),
                updatedAt: Date.now()
            });

            alert("Episode Added Successfully!");
            document.getElementById("epLink").value = "";
            fetchEpisodes();
        } catch (e) {
            alert("Error: " + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "Shorten & Add Episode";
        }
    };

    // --- CLOUDINARY & ADD ANIME ---
    document.getElementById("uploadImgBtn").onclick = () => {
        cloudinary.createUploadWidget({ cloudName: "dmxqosmk0", uploadPreset: "asi_anime_upload" }, (err, res) => {
            if (!err && res.event === "success") {
                uploadedImage = res.info.secure_url;
                document.getElementById("imgPreview").src = uploadedImage;
                document.getElementById("imgPreview").style.display = "block";
            }
        }).open();
    };

    document.getElementById("addAnimeBtn").onclick = async () => {
        const name = document.getElementById("newName").value.trim();
        if(!name || !uploadedImage) return alert("Name and Image required");

        await addDoc(collection(db, "anime"), {
            name,
            season: document.getElementById("newSeason").value || "1",
            year: document.getElementById("newYear").value || "2024",
            description: document.getElementById("newDesc").value,
            image: uploadedImage,
            episodes: [],
            updatedAt: Date.now()
        });
        alert("Anime Added!");
        loadList();
    };

    document.getElementById("deleteAnimeBtn").onclick = async () => {
        const id = document.getElementById("deleteSelect").value;
        if(id && confirm("Are you sure?")) {
            await deleteDoc(doc(db, "anime", id));
            loadList();
            alert("Deleted");
        }
    };
</script>
</body>
</html>
