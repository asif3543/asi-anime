<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ASI Admin Panel - Advanced</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --box-bg: #1e1e1e;
            --primary: #ff4500;
            --primary-hover: #e03e00;
            --text-color: #ffffff;
            --border: #333333;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .admin-container { max-width: 800px; margin: 0 auto; }
        .admin-title { text-align: center; color: var(--primary); margin-bottom: 30px; font-size: 28px; }
        .box { background-color: var(--box-bg); padding: 25px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); border: 1px solid var(--border); }
        .box h3 { margin-top: 0; border-bottom: 2px solid var(--border); padding-bottom: 10px; color: var(--primary); }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); background: #2a2a2a; color: white; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .preview-img { max-width: 150px; border-radius: 8px; margin: 10px auto; display: block; }
        .shortener-item { background: #252525; padding: 10px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #444; }
        .ep-list { margin-top: 15px; max-height: 200px; overflow-y: auto; background: #2a2a2a; border-radius: 6px; padding: 10px; }
        .ep-item { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 8px 12px; margin-bottom: 8px; border-radius: 4px; border: 1px solid var(--border); }
        .ep-item button { width: auto; padding: 5px 10px; font-size: 12px; background: #d32f2f; }
        .search-box { margin-bottom: 10px; border-color: var(--primary); }
    </style>
</head>
<body>

<div class="admin-container">
    <h2 class="admin-title">🔥 ASI Admin Panel</h2>

    <!-- LOGIN BOX -->
    <div class="box" id="loginBox">
        <h3 style="text-align:center;">Admin Login</h3>
        <input type="email" id="adminEmail" placeholder="Admin Email">
        <input type="password" id="adminPass" placeholder="Password">
        <button id="loginBtn">Login</button>
        <p id="loginError" style="color: #d32f2f; text-align: center; margin-top: 10px; font-size: 14px;"></p>
    </div>

    <div id="adminPanel" style="display:none">

        <div style="text-align: right; margin-bottom: 20px;">
            <button id="logoutBtn" style="width: auto; background: #444;">Logout</button>
        </div>

        <!-- MULTIPLE SHORTENER MANAGER -->
        <div class="box">
            <h3>🔗 Shortener Accounts Manager</h3>
            <div class="grid-2">
                <input id="shortName" placeholder="Site Name (e.g., NowShort)">
                <input id="shortGmail" placeholder="Account Gmail">
            </div>
            <input id="shortApi" placeholder="API Token (e.g., 253b5bad304c60...)">
            <input id="shortUrl" placeholder="API URL (e.g., https://nowshort.com/api)">
            <button id="addShortenerBtn" style="background: #2e7d32;">Add Shortener Account</button>
            
            <div id="shortenerList" style="margin-top: 15px;">
                <!-- Saved Shorteners will appear here -->
            </div>
        </div>

        <!-- ADD ANIME -->
        <div class="box">
            <h3>🎬 Add New Anime</h3>
            <input id="newName" placeholder="Anime Name">
            <div class="grid-2">
                <input id="newSeason" placeholder="Season">
                <input id="newYear" type="number" placeholder="Year">
            </div>
            <textarea id="newDesc" placeholder="Description"></textarea>
            <button id="uploadImgBtn" type="button">📸 Select Image</button>
            <img id="imgPreview" class="preview-img" style="display:none;">
            <button id="addAnimeBtn" style="margin-top: 15px;">Save Anime</button>
        </div>

        <!-- ADD & MANAGE EPISODES (With Search) -->
        <div class="box">
            <h3>📺 Add & Manage Episodes</h3>
            
            <input type="text" id="epSearch" class="search-box" placeholder="🔍 Search Anime to add episode...">
            <select id="animeSelect">
                <option value="">Select Anime</option>
            </select>

            <div class="grid-2">
                <input id="epNum" type="number" placeholder="Episode Number">
                <input id="epLink" placeholder="Drive / Telegram / Bot Link">
            </div>
            <button id="addEpBtn">Shorten & Add Episode</button>

            <div id="existingEpisodesBox" style="display:none; margin-top: 20px;">
                <h4 style="color: #ff4500;">Current Episodes</h4>
                <div id="episodesContainer" class="ep-list"></div>
            </div>
        </div>

        <!-- DELETE ANIME -->
        <div class="box">
            <h3>🗑️ Delete Anime</h3>
            <input type="text" id="deleteSearch" class="search-box" placeholder="🔍 Search Anime to Delete...">
            <select id="deleteSelect">
                <option value="">Select Anime to Delete</option>
            </select>
            <button id="deleteAnimeBtn" class="delete-btn" style="background: #d32f2f;">Delete Entire Anime</button>
        </div>

    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import {
        getFirestore, collection, addDoc, getDoc, getDocs, doc, updateDoc,
        deleteDoc, arrayUnion, arrayRemove, query, orderBy
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
    import { 
        getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA8Z3CvFTL402UF_6zY9v2iWLP8e_kZo1Q",
        authDomain: "asi-anime.firebaseapp.com",
        projectId: "asi-anime",
        storageBucket: "asi-anime.firebasestorage.app",
        messagingSenderId: "1029720406470",
        appId: "1:1029720406470:web:8ad8ad2d2ea1c7a4725ac7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let uploadedImage = "";
    let selectedAnimeId = "";
    let shortenerAccounts = [];

    /* --- AUTH LOGIC --- */
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById("adminPanel").style.display = "block";
            document.getElementById("loginBox").style.display = "none";
            loadList();
            loadShorteners();
        } else {
            document.getElementById("adminPanel").style.display = "none";
            document.getElementById("loginBox").style.display = "block";
        }
    });

    document.getElementById("loginBtn").onclick = async () => {
        const email = document.getElementById("adminEmail").value;
        const pass = document.getElementById("adminPass").value;
        try { await signInWithEmailAndPassword(auth, email, pass); } 
        catch (error) { document.getElementById("loginError").innerText = error.message; }
    };

    document.getElementById("logoutBtn").onclick = () => signOut(auth);

    /* --- SHORTENER MANAGER LOGIC --- */
    async function loadShorteners() {
        const snap = await getDocs(collection(db, "shorteners"));
        shortenerAccounts = [];
        const listDiv = document.getElementById("shortenerList");
        listDiv.innerHTML = "";
        snap.forEach(d => {
            const data = d.data();
            data.id = d.id;
            shortenerAccounts.push(data);
            listDiv.innerHTML += `
                <div class="shortener-item">
                    <span><b>${data.name}</b> (${data.gmail})</span>
                    <button onclick="window.removeShortener('${d.id}')" style="width:auto; padding:5px; background:red;">Remove</button>
                </div>`;
        });
    }

    document.getElementById("addShortenerBtn").onclick = async () => {
        const name = document.getElementById("shortName").value.trim();
        const api = document.getElementById("shortApi").value.trim();
        const url = document.getElementById("shortUrl").value.trim();
        const gmail = document.getElementById("shortGmail").value.trim();
        if(!name || !api || !url) return alert("Fill all fields!");
        
        await addDoc(collection(db, "shorteners"), { name, api, url, gmail });
        alert("Account Added!");
        loadShorteners();
    };

    window.removeShortener = async (id) => {
        if(confirm("Remove this account?")) {
            await deleteDoc(doc(db, "shorteners", id));
            loadShorteners();
        }
    };

    /* --- AUTO SHORTENING (MULTI-ACCOUNT) --- */
    async function getShortenedLink(longUrl) {
        if (shortenerAccounts.length === 0) throw new Error("No shortener accounts added in Admin Panel!");

        // Try accounts one by one
        for (let acc of shortenerAccounts) {
            try {
                const apiUrl = `${acc.url}?api=${acc.api}&url=${encodeURIComponent(longUrl)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (data.status === "success" || data.shortenedUrl) {
                    return data.shortenedUrl || data.link;
                }
            } catch (err) {
                console.log(`Account ${acc.name} failed, trying next...`);
            }
        }
        throw new Error("All shortener accounts failed! Check API Keys or Site Status.");
    }

    /* --- SEARCH FEATURE FOR ALL DROPDOWNS --- */
    function setupSearch(inputId, selectId) {
        document.getElementById(inputId).oninput = function(e) {
            const term = e.target.value.toLowerCase();
            const options = document.getElementById(selectId).options;
            for (let i = 0; i < options.length; i++) {
                const text = options[i].text.toLowerCase();
                options[i].style.display = text.includes(term) || options[i].value === "" ? "block" : "none";
            }
        };
    }
    setupSearch("epSearch", "animeSelect");
    setupSearch("deleteSearch", "deleteSelect");

    /* --- ANIME & EPISODE LOGIC --- */
    async function loadList() {
        const snap = await getDocs(query(collection(db, "anime"), orderBy("name")));
        const animeSelect = document.getElementById("animeSelect");
        const deleteSelect = document.getElementById("deleteSelect");
        animeSelect.innerHTML = deleteSelect.innerHTML = "<option value=''>Select Anime</option>";
        snap.forEach(d => {
            const opt = `<option value="${d.id}">${d.data().name}</option>`;
            animeSelect.innerHTML += opt;
            deleteSelect.innerHTML += opt;
        });
    }

    document.getElementById("animeSelect").onchange = async (e) => {
        selectedAnimeId = e.target.value;
        if(!selectedAnimeId) return document.getElementById("existingEpisodesBox").style.display = "none";
        fetchEpisodes();
    };

    async function fetchEpisodes() {
        const docSnap = await getDoc(doc(db, "anime", selectedAnimeId));
        if(docSnap.exists()){
            const eps = docSnap.data().episodes || [];
            const container = document.getElementById("episodesContainer");
            document.getElementById("existingEpisodesBox").style.display = "block";
            container.innerHTML = eps.sort((a,b)=>a.ep - b.ep).map(ep => `
                <div class="ep-item">
                    <span>Episode ${ep.ep}</span>
                    <button onclick="window.delEp('${ep.ep}','${ep.link}')">Delete</button>
                </div>
            `).join('');
        }
    }

    window.delEp = async (ep, link) => {
        if(confirm("Delete this episode?")) {
            await updateDoc(doc(db, "anime", selectedAnimeId), { episodes: arrayRemove({ep, link}) });
            fetchEpisodes();
        }
    };

    document.getElementById("addEpBtn").onclick = async () => {
        const ep = document.getElementById("epNum").value;
        const link = document.getElementById("epLink").value.trim();
        const btn = document.getElementById("addEpBtn");

        if(!selectedAnimeId || !ep || !link) return alert("Fill all details!");

        try {
            btn.disabled = true;
            btn.innerText = "Shortening Link...";
            const finalShortLink = await getShortenedLink(link);

            btn.innerText = "Saving...";
            await updateDoc(doc(db, "anime", selectedAnimeId), {
                episodes: arrayUnion({ ep, link: finalShortLink }),
                updatedAt: Date.now()
            });
            alert("Episode Added with ShortLink!");
            document.getElementById("epLink").value = "";
            fetchEpisodes();
        } catch (err) { alert(err.message); }
        finally { btn.disabled = false; btn.innerText = "Shorten & Add Episode"; }
    };

    /* --- ADD ANIME & IMAGE --- */
    document.getElementById("uploadImgBtn").onclick = () => {
        cloudinary.createUploadWidget({ cloudName: "dmxqosmk0", uploadPreset: "asi_anime_upload" }, (err, res) => {
            if (!err && res.event === "success") {
                uploadedImage = res.info.secure_url;
                document.getElementById("imgPreview").src = uploadedImage;
                document.getElementById("imgPreview").style.display = "block";
            }
        }).open();
    };

    document.getElementById("addAnimeBtn").onclick = async () => {
        const name = document.getElementById("newName").value.trim();
        if(!name || !uploadedImage) return alert("Name & Image required!");
        await addDoc(collection(db, "anime"), {
            name, season: document.getElementById("newSeason").value,
            year: document.getElementById("newYear").value,
            description: document.getElementById("newDesc").value,
            image: uploadedImage, episodes: [], updatedAt: Date.now()
        });
        alert("Anime Added!");
        loadList();
    };

    document.getElementById("deleteAnimeBtn").onclick = async () => {
        const id = document.getElementById("deleteSelect").value;
        if(id && confirm("Delete entire anime permanently?")) {
            await deleteDoc(doc(db, "anime", id));
            loadList();
            alert("Deleted!");
        }
    };
</script>
</body>
</html>
