<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Watch Online | ASI Anime</title>
    <meta name="description" content="View detailed information and episodes. Watch high quality Anime, K-Dramas, and Movies in Hindi Sub & Dub.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <header>
        <a href="index.html" class="logo">ASI <span>Studio</span></a>
    </header>

    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>

    <div id="detailBox" style="text-align:center; margin-top:50px; color:var(--primary);">
        <div class="loader-container">
            <div class="loader"></div>
            <h2>Loading Data...</h2>
        </div>
    </div>

    <div class="social-footer">
        <a href="https://t.me/hindisubinganime" target="_blank" class="btn-tg"><i class="fab fa-telegram"></i> Free Channel</a>
        <a href="https://t.me/hindisubanime_q" target="_blank" class="btn-gc"><i class="fas fa-comments"></i> Group</a>
        <!-- YAHAN APNA PAID TELEGRAM GROUP LINK DAALEIN 👇 -->
        <a href="https://t.me/YOUR_PAID_GROUP_LINK" target="_blank" class="btn-paid"><i class="fas fa-gem"></i> Premium Anime</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyA8Z3CvFTL402UF_6y9v1iWLP8e_kZo1Q",
            authDomain: "asi-anime.firebaseapp.com",
            projectId: "asi-anime"
        });
        const db = getFirestore(app);
        const urlParams = new URLSearchParams(window.location.search);
        const animeId = urlParams.get('id');

        // ========================================================
        // 🔥 TRIPLE-LAYER GUARANTEE DYNAMIC SHORTENER ENGINE
        // ========================================================
        window.openEpisode = async function(originalLink, btnElement) {
            
            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating Link...';
            btnElement.style.pointerEvents = "none";
            btnElement.style.opacity = "0.7";

            try {
                // 1. Get Shortener API details from DB
                const settingsSnap = await getDoc(doc(db, "settings", "general"));
                if(!settingsSnap.exists() || !settingsSnap.data().shortUrl || !settingsSnap.data().shortKey) {
                    // Agar API set nahi hai toh hi original link dega
                    window.open(originalLink, "_blank");
                    resetButton(btnElement, originalText);
                    return;
                }

                let shortUrl = settingsSnap.data().shortUrl.trim();
                let shortKey = settingsSnap.data().shortKey.trim();

                // Auto-fix URL just in case admin typed it wrong
                if (!shortUrl.endsWith("api")) {
                    shortUrl = shortUrl.endsWith("/") ? shortUrl + "api" : shortUrl + "/api";
                }

                // Append &format=text to force simple response from API
                const encodedTargetUrl = encodeURIComponent(originalLink);
                const directApiCall = `${shortUrl}?api=${shortKey}&url=${encodedTargetUrl}&format=text`;

                // TRIPLE FALLBACK ARRAY (Direct -> Proxy 1 -> Proxy 2)
                const fetchEndpoints = [
                    directApiCall, // Try 1
                    `https://api.allorigins.win/raw?url=${encodeURIComponent(directApiCall)}`, // Try 2
                    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(directApiCall)}` // Try 3
                ];

                let finalShortLink = null;

                // Loop through options until one works
                for (let url of fetchEndpoints) {
                    try {
                        const response = await fetch(url, { method: "GET" });
                        const textData = await response.text();

                        // Check if response is a pure URL
                        if (textData && textData.trim().match(/^https?:\/\/[^\s]+$/i)) {
                            finalShortLink = textData.trim();
                            break; // Stop loop, we found the link!
                        } 
                        // If it's not a pure URL, try parsing as JSON
                        else {
                            let jsonData = JSON.parse(textData);
                            if (jsonData.shortenedUrl) { finalShortLink = jsonData.shortenedUrl; break; }
                            if (jsonData.short_url) { finalShortLink = jsonData.short_url; break; }
                        }
                    } catch(err) {
                        console.log(`Failed attempting endpoint: ${url}`);
                    }
                }

                // Check final result
                if (finalShortLink && finalShortLink !== "") {
                    // YAY! Success. Open short link.
                    window.open(finalShortLink, "_blank");
                } else {
                    // Ye error tab aayega agar aapki API Key puri tarah galat ho
                    throw new Error("Invalid API Key or API Server Down.");
                }

            } catch(e) {
                console.error("Master Fetch Error:", e);
                Swal.fire({
                    icon: 'error',
                    title: 'Shortener API Error',
                    text: 'Your API Key might be wrong. Opening direct link for now...',
                    timer: 3000,
                    showConfirmButton: false
                });
                setTimeout(() => { window.open(originalLink, "_blank"); }, 3000);
            }

            resetButton(btnElement, originalText);
        };

        function resetButton(btn, text) {
            btn.innerHTML = text;
            btn.style.pointerEvents = "auto";
            btn.style.opacity = "1";
        }
        // ========================================================


        async function loadDetail() {
            if (!animeId) {
                document.getElementById("detailBox").innerHTML = "<h2>Content Not Found! 😢</h2>";
                return;
            }

            try {
                const docSnap = await getDoc(doc(db, "anime", animeId));
                
                if (docSnap.exists()) {
                    let a = docSnap.data();
                    let imgSrc = a.image || "https://via.placeholder.com/250x350";
                    let typeText = a.type ? a.type.toUpperCase() : "ANIME";
                    
                    let eps = a.episodes || [];
                    eps.sort((x, y) => parseFloat(x.ep) - parseFloat(y.ep));

                    let episodesHTML = "";
                    if(eps.length === 0){
                        episodesHTML = "<p style='color:#a0a0b0; width:100%; text-align:center;'>No episodes uploaded yet. 🚧</p>";
                    } else {
                        eps.forEach(episode => {
                            let safeLink = episode.link.trim();
                            if(safeLink && !safeLink.match(/^https?:\/\//i)) {
                                safeLink = "https://" + safeLink;
                            }
                            
                            episodesHTML += `
                                <button class="ep-btn" onclick="openEpisode('${safeLink}', this)">
                                    <i class="fas fa-play-circle"></i> Ep ${episode.ep}
                                </button>
                            `;
                        });
                    }

                    document.getElementById("detailBox").outerHTML = `
                        <div class="detail-container">
                            <img src="${imgSrc}" alt="${a.name} Poster" class="detail-img">
                            <div class="detail-info">
                                <h1>${a.name}</h1>
                                ${a.season ? `<h4 class="detail-season">Season ${a.season}</h4>` : ''}
                                
                                <div style="margin: 10px 0 15px;">
                                    <span class="badge" style="background:var(--primary); color:white;">${typeText}</span>
                                    <span class="badge"><i class="fas fa-tags"></i> ${a.genre || "General"}</span>
                                    ${a.year ? `<span class="badge"><i class="far fa-calendar-alt"></i> ${a.year}</span>` : ''}
                                    ${a.status ? `<span class="badge"><i class="fas fa-info-circle"></i> ${a.status}</span>` : ''}
                                </div>
                                
                                <p class="detail-desc">${a.description || "No description available at the moment."}</p>
                                
                                <div class="episodes-box">
                                    <h3>📺 Watch / Download Episodes</h3>
                                    <div class="episodes-grid">
                                        ${episodesHTML}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    document.getElementById("detailBox").innerHTML = "<h2>Content Not Found! 😢</h2>";
                }
            } catch (error) {
                console.error("Error loading details:", error);
                document.getElementById("detailBox").innerHTML = "<h2>Error loading details! ⚠️</h2>";
            }
        }

        loadDetail();
    </script>
</body>
</html>
